<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify Authorization</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050505;
        color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 14px;
      }
      .card {
        border: 1px solid #27272a;
        background: #111113;
        border-radius: 12px;
        padding: 20px 24px;
        text-align: center;
        max-width: 340px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p id="status">Completing Spotify connection...</p>
    </div>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var code = params.get('code');
        var state = params.get('state');
        var error = params.get('error');

        if (window.opener) {
          window.opener.postMessage(
            {
              type: 'SPOTIFY_PKCE_CALLBACK',
              code: code,
              state: state,
              error: error,
            },
            '*'
          );
          document.getElementById('status').textContent = error
            ? 'Authorization cancelled. Closing window...'
            : 'Connected to Spotify. Closing window...';
          setTimeout(function () {
            window.close();
          }, 250);
        } else {
          document.getElementById('status').textContent =
            'Authorization finished. You may close this tab and return to the admin studio.';
        }
      })();
    </script>
  </body>
</html>
